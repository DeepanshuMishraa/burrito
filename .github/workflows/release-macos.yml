name: Build macOS release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build, sign, and publish update
    runs-on: macos-26

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Release tag must look like 1.2.3 or v1.2.3."
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set up Developer ID signing keychain
        env:
          MACOS_DEVELOPER_ID_CERT: ${{ secrets.MACOS_DEVELOPER_ID_CERT }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_APP_PASSWORD: ${{ secrets.NOTARIZATION_APP_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          if [[ -z "$MACOS_DEVELOPER_ID_CERT" || -z "$MACOS_DEVELOPER_ID_CERT_PASSWORD" ]]; then
            echo "MACOS_DEVELOPER_ID_CERT (base64-encoded .p12) and MACOS_DEVELOPER_ID_CERT_PASSWORD"
            echo "are required. Releases must be Developer ID signed: ad-hoc signed apps lose"
            echo "their Screen Recording, Microphone, and Calendar permissions on every update."
            echo "Export your Developer ID Application certificate as a .p12, base64-encode it,"
            echo "and add both secrets to this repository."
            exit 1
          fi
          if [[ -z "$NOTARIZATION_APPLE_ID" || -z "$NOTARIZATION_APP_PASSWORD" || -z "$NOTARIZATION_TEAM_ID" ]]; then
            echo "NOTARIZATION_APPLE_ID, NOTARIZATION_APP_PASSWORD, and NOTARIZATION_TEAM_ID"
            echo "are required for notarization. Add them as repository secrets."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          printf '%s' "$MACOS_DEVELOPER_ID_CERT" | base64 -D > "$CERT_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/burrito-signing.keychain-db"
          KEYCHAIN_PASSWORD="burrito-ci-keychain"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$MACOS_DEVELOPER_ID_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

      - name: Build Burrito
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          xcodebuild \
            -project burrito.xcodeproj \
            -scheme burrito \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/BurritoDerivedData" \
            -skipPackagePluginValidation \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            build

      - name: Verify code signature
        run: |
          APP="$RUNNER_TEMP/BurritoDerivedData/Build/Products/Release/Burrito.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Identifier|Authority|TeamIdentifier" || true

      - name: Create disk image
        run: |
          APP="$RUNNER_TEMP/BurritoDerivedData/Build/Products/Release/Burrito.app"
          STAGE="$RUNNER_TEMP/BurritoDMG"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/Burrito.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname Burrito \
            -srcfolder "$STAGE" \
            -format UDZO \
            "$RUNNER_TEMP/Burrito.dmg"

      - name: Notarize and staple disk image
        env:
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_APP_PASSWORD: ${{ secrets.NOTARIZATION_APP_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          xcrun notarytool submit "$RUNNER_TEMP/Burrito.dmg" \
            --apple-id "$NOTARIZATION_APPLE_ID" \
            --password "$NOTARIZATION_APP_PASSWORD" \
            --team-id "$NOTARIZATION_TEAM_ID" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/Burrito.dmg"
          xcrun stapler validate "$RUNNER_TEMP/Burrito.dmg"

      - name: Sign update and create appcast
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.value }}
          BUILD_NUMBER: ${{ github.run_number }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "SPARKLE_PRIVATE_KEY is not configured."
            exit 1
          fi

          SIGN_UPDATE="$(find "$RUNNER_TEMP/BurritoDerivedData/SourcePackages/artifacts" \
            -path '*/Sparkle/bin/sign_update' -type f -print -quit)"
          if [[ -z "$SIGN_UPDATE" ]]; then
            echo "Sparkle sign_update was not found in resolved package artifacts."
            exit 1
          fi

          DMG="$RUNNER_TEMP/Burrito.dmg"
          SIGNATURE="$(printf '%s' "$SPARKLE_PRIVATE_KEY" |
            "$SIGN_UPDATE" --ed-key-file - "$DMG")"
          PUBLISHED_AT="$(date -R)"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Burrito.dmg"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

          {
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>'
            printf '%s\n' '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
            printf '%s\n' '  <channel>'
            printf '%s\n' '    <title>Burrito updates</title>'
            printf '%s\n' '    <description>Stable Burrito releases.</description>'
            printf '%s\n' '    <language>en</language>'
            printf '%s\n' '    <item>'
            printf '      <title>Burrito %s</title>\n' "$VERSION"
            printf '      <link>%s</link>\n' "$RELEASE_URL"
            printf '      <pubDate>%s</pubDate>\n' "$PUBLISHED_AT"
            printf '      <sparkle:version>%s</sparkle:version>\n' "$BUILD_NUMBER"
            printf '      <sparkle:shortVersionString>%s</sparkle:shortVersionString>\n' "$VERSION"
            printf '%s\n' '      <sparkle:minimumSystemVersion>26.0.0</sparkle:minimumSystemVersion>'
            printf '%s\n' '      <sparkle:hardwareRequirements>arm64</sparkle:hardwareRequirements>'
            printf '      <enclosure url="%s" type="application/octet-stream" %s />\n' \
              "$DOWNLOAD_URL" "$SIGNATURE"
            printf '%s\n' '    </item>'
            printf '%s\n' '  </channel>'
            printf '%s\n' '</rss>'
          } > "$RUNNER_TEMP/appcast.xml"

      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/Burrito.dmg" \
            "$RUNNER_TEMP/appcast.xml" \
            --clobber
