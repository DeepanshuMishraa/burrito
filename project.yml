name: burrito
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.0.2
    CURRENT_PROJECT_VERSION: 1
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.15.5
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    from: 4.6.1
  SwiftAISDK:
    url: https://github.com/zaidmukaddam/swift-ai-sdk.git
    # 0.2.0 plus the Xcode 26 compatibility fix from upstream PR #1.
    revision: 9a8ea7e5f718af957f222c12ba09caff79caf3d0
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    exactVersion: 2.31.3
  Hugeicons:
    url: https://github.com/iSapozhnik/hugeicons-swift.git
    exactVersion: 4.1.7
targets:
  burrito:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sources
      - path: Resources
        excludes:
          - Fonts/Licenses
        buildPhase: resources
      - path: Resources/Fonts/Licenses
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - package: FluidAudio
      - package: Lottie
      - package: SwiftAISDK
        product: AI
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: Hugeicons
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.local.burrito
        PRODUCT_NAME: Burrito
        PRODUCT_MODULE_NAME: Burrito
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: Burrito.entitlements
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YY5H9WM46P
    entitlements:
      path: Burrito.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
  BurritoTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Tests
    dependencies:
      - target: burrito
      - package: SwiftAISDK
        product: AITesting
    settings:
      base:
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YY5H9WM46P
        PRODUCT_BUNDLE_IDENTIFIER: com.local.burrito.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Burrito.app/Contents/MacOS/Burrito"
        BUNDLE_LOADER: "$(TEST_HOST)"
